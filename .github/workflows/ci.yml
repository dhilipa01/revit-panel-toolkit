name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Core tests
        run: python tests/test_core.py
      - name: IDS tests
        run: python tests/test_ids.py
      - name: Adapter tests against a fake Revit
        run: python tests/test_adapter.py
      - name: Example runs
        run: python examples/panel_budget.py > /dev/null
